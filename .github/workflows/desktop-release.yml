# Builds the desktop app (Tauri) for macOS (arm64 + x86_64), Linux, and
# Windows on GitHub-hosted runners — which already carry the native build
# tools (Xcode CLT, MSVC) — and uploads the bundles as assets on the
# matching GitHub Release. This means an end user never needs Rust or any
# OS-native build tools themselves: src/scripts/install/install_desktop.sh|ps1
# download a prebuilt bundle from the release instead of compiling one
# locally, falling back to a from-source build only if no matching asset
# is found (e.g. an unreleased checkout, or a platform/arch with none).
#
# Triggers on any `v*` tag push (the same tags src/scripts/install/uninstall.py
# and the release process already use) and via workflow_dispatch so
# existing tags can get assets attached retroactively.
#
# Windows had NO release assets for the last three tags (v1.0.0b,
# v1.0.0b1, v1.0.1b) — confirmed live via `gh run view --json jobs`:
# macOS/Linux succeeded every time; Windows failed every time, always at
# the exact same step (`tauri.conf.json`'s "targets": "all" makes every
# platform attempt every bundle format it supports, and on Windows that
# includes MSI). The actual error: "optional pre-release identifier in
# app version must be numeric-only... for msi target" — a hard WiX/MSI
# constraint this project's `-beta.N` version scheme (tauri.conf.json's
# "version": "1.0.1-beta.0") can never satisfy, unlike macOS/Linux's
# bundlers, which don't share that rule. The Windows .exe itself was
# already building successfully before this (confirmed in the failure
# log: "Built application at: ...desktop.exe" precedes the MSI-bundling
# failure) — only the MSI wrapping step ever failed, which was enough to
# fail the whole `tauri build` command and lose every asset for that
# platform, not just the MSI one. Fixed by scoping Windows to NSIS only
# via src-tauri/tauri.windows.conf.json (Tauri v2 merges a per-platform
# config file over the base one — see
# https://v2.tauri.app/develop/configuration-files/), leaving the base
# config's "all" untouched for macOS/Linux, which were never broken.
name: desktop-release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to build and attach assets to"
        required: true

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Root-level install so the npm workspace (src/core, src/tui,
      # src/tauri) links correctly; src/core has no build hook of its
      # own (a gap fixed in the installer scripts too), so build it
      # explicitly before desktop's build runs.
      - run: npm ci
      - run: npm run build:core

      # Windows code signing (Azure Trusted Signing) — only when the
      # signing secrets are configured. See docs/windows-code-signing.md.
      # Absent the secrets this is a no-op and the build ships unsigned,
      # exactly as before.
      - name: enable Windows installer signing
        if: matrix.platform == 'windows-latest' && vars.WINDOWS_SIGN_ENABLED == 'true'
        shell: pwsh
        env:
          TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.TRUSTED_SIGNING_ACCOUNT_NAME }}
          TRUSTED_SIGNING_CERT_PROFILE: ${{ secrets.TRUSTED_SIGNING_CERT_PROFILE }}
        run: |
          dotnet tool install --global trusted-signing-cli
          $cmd = "trusted-signing-cli -e $env:TRUSTED_SIGNING_ENDPOINT -a $env:TRUSTED_SIGNING_ACCOUNT_NAME -c $env:TRUSTED_SIGNING_CERT_PROFILE %1"
          $conf = "src/tauri/src-tauri/tauri.windows.conf.json"
          $json = Get-Content $conf -Raw | ConvertFrom-Json
          if (-not $json.bundle.windows) { $json.bundle | Add-Member -NotePropertyName windows -NotePropertyValue (@{}) }
          $json.bundle.windows | Add-Member -NotePropertyName signCommand -NotePropertyValue $cmd -Force
          $json | ConvertTo-Json -Depth 10 | Set-Content $conf
          Write-Host "signing enabled for the Windows bundle"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        with:
          projectPath: src/tauri
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "aplyx ${{ github.event.inputs.tag || github.ref_name }}"
          releaseBody: "Desktop app bundles for this release — see the GitHub Release notes for what's new. Installed automatically by src/scripts/install/install_desktop.sh|ps1, or download the file matching your OS/arch directly."
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }}
