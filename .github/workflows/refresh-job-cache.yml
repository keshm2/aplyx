# Populates the shared Supabase job_cache table on a schedule (see
# src/core/src/refreshJobCache.ts for what this actually does and
# why) so searchJobs()'s cache checks (src/core/src/jobCache.ts)
# have fresh data to hit instead of always falling back to a live
# per-source fetch.
#
# CADENCE: Monday/Wednesday/Friday, not daily (fixed 2026-08-26, second
# attempt: see below). Companies don't post new listings every single
# day either: a run that finds nothing new is still a full ~14k-row
# chunked upsert against the exact resource (Supabase egress/disk I/O)
# that already pushed this project past its free-tier budget once before
# (see refreshJobCache.ts) and did so again under the daily cadence.
# Cutting to 3 runs/week (from 7) cuts this workflow's own contribution
# to that by more than half.
#
# NOT a day-of-month step value (`*/2 * *`): that was this fix's first
# attempt, and it silently didn't work: confirmed live via
# `gh run list --workflow=refresh-job-cache.yml`, which showed the
# workflow still firing every single calendar day after that change
# shipped and was live on main for a week. Step values in cron's
# day-of-month field are a documented GitHub Actions unreliability, not
# something specific to this expression: day-of-week fields (a 7-value
# range, not day-of-month's 31) don't share that problem, so an explicit
# weekday list is what's actually used here instead. Confirm any future
# cadence change the same way (`gh run list`, not just "the YAML looks
# right"): a syntactically valid cron expression silently not firing as
# written is exactly the failure mode that already happened once.
#
# Max gap is Friday -> Monday (3 days, not 2): CACHE_TTL_MS and
# REDIS_WARM_TTL_SECONDS below are sized against that 3-day worst case,
# not a uniform 48h.
#
# 08:37 UTC, deliberately not on the hour: off-peak for GitHub's
# scheduler (~1:30am US Pacific), so the run is far less likely to be
# delayed or dropped, and the cache is fresh before the US workday.
#
# ADDITIVE ONLY: a run adds newly-seen postings and extends the
# retention window on ones still live. It never deletes and never
# overwrites an existing row's discovery timestamp, so a bad fetch can
# never shrink the cache: see refreshJobCache.ts's header.
#
# Needs two repository secrets: SUPABASE_URL (the project's own URL,
# not sensitive, just stored alongside the other one for convenience)
# and SUPABASE_SECRET_KEY (Project Settings → API Keys → Secret keys in
# the Supabase dashboard: bypasses RLS; never printed, never written to
# a file, only ever passed as an env var to the one process that needs
# it). Company slugs to refresh come from the committed
# src/config/job_cache_targets.json, not the gitignored, PII-bearing
# src/config/targets.json.
#
# Also needs two more repository secrets for the Redis warm layer in
# front of job_cache (see src/core/src/jobCacheRedis.ts):
# UPSTASH_REDIS_REST_URL and UPSTASH_REDIS_WRITE_TOKEN (a *write*-capable
# Upstash token, separate from the read-only one baked into
# src/config/job_cache_redis.json for clients, same never-in-a-client-bundle
# discipline as SUPABASE_SECRET_KEY). If either is unset, the warm step
# logs and skips per source rather than failing the run: the Postgres
# upsert above it already succeeded and is unaffected.
name: refresh-job-cache
on:
  schedule:
    - cron: "37 8 * * 1,3,5"
  workflow_dispatch: {}

# This job is the only writer to job_cache, and a run takes ~20 minutes.
# Two overlapping runs would interleave chunked upserts against the same
# rows and double the write pressure on the exact resource (free-tier
# disk I/O) that this whole file is already tuned around. cancel-in-progress
# is false on purpose: an in-flight run is partway through writing real
# data, so a manual dispatch should QUEUE behind it, never kill it.
concurrency:
  group: refresh-job-cache
  cancel-in-progress: false

# Read-only. This workflow talks to Supabase and Upstash via secrets; it
# has no reason to be able to write to the repo.
permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Deliberately paced (25-row chunks, 1.5s between each — see
    # refreshJobCache.ts's UPSERT_INTER_CHUNK_DELAY_MS, added after the
    # Supabase project hit its disk I/O limit) so ~14k rows across ~560
    # chunks realistically takes 20-25 minutes; observed live at 18-25
    # minutes across the run history. 60 is a safety cap well clear of
    # that ceiling, not the expected floor — the old 30 left only ~5
    # minutes of headroom over a normal run, so a single slow source
    # could have tripped it and been misread as a hang. Without any cap,
    # a genuine hang would burn CI minutes for hours instead of failing.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:core
      - run: node src/core/dist/refreshJobCache.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_WRITE_TOKEN: ${{ secrets.UPSTASH_REDIS_WRITE_TOKEN }}
