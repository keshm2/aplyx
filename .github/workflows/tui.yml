# Phase 13: TUI package CI — typecheck, build, and a non-interactive
# smoke run. The repo's live config/state files are gitignored, so the
# smoke test only exercises commands that tolerate their absence.
# src/tui/ depends on the shared @aplyx/core workspace package (src/core),
# so installs/builds run from the repo root rather than src/tui/ standalone.
name: tui
on:
  push:
    paths: ["src/tui/**", "src/core/**", "package.json", "package-lock.json", ".github/workflows/tui.yml"]
  pull_request:
    paths: ["src/tui/**", "src/core/**", "package.json", "package-lock.json", ".github/workflows/tui.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build --workspace=@aplyx/core
      - run: npm run typecheck --workspace=@keshm/aplyx
      - run: npm run build --workspace=@keshm/aplyx
      - run: npm run smoke --workspace=@keshm/aplyx
