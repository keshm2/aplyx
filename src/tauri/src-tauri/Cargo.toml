[package]
name = "desktop"
version = "1.0.9-beta.0"
description = "aplyx desktop app, a Tauri shell over the shared @aplyx/core TypeScript core"
authors = ["aplyx"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-deep-link = "2.4.9"
keyring = "3"
sha2 = "0.10"

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
# Windows/Linux route an aplyx:// deep-link click to a NEW process with the
# URL as argv rather than into the running app. The single-instance plugin's
# `deep-link` feature forwards that argv into the primary instance and
# re-triggers the deep-link plugin's open-url event there, so the auth
# callback completes in the window the user is actually looking at.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
